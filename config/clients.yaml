# AR follow-up agent — per-client contract terms, exclusions and carry-forward flags.
#
# Angie maintains this file. Nothing here requires a code change.
# Validate after every edit:  python -m ar_followup validate-config
#
# MATCHING: a client is matched to a QBO customer by `qbo_customer_id` when it is
# set (exact, preferred), otherwise by `name` or any `aliases` entry against the
# QBO DisplayName, case-insensitively. A QBO customer with no entry here is
# billed on the defaults in settings.yaml and every invoice for it is flagged
# "no contract terms on file" rather than silently reminded.
#
# TERMS: `terms` is a list of periods, oldest first. Each period is the contract
# as it stood between `effective_from` and `effective_to` (null = still current).
# A step-down is a new period, not an edit to the old one — the history is what
# lets the agent catch an invoice billed on terms that expired.
#
# STATUS: `reminders: suppressed` stops all automated email for a client. The
# client still appears in the digest under flags, so nothing goes quiet.

clients:
  - name: Kaaral
    # "Kaaral USA LLC" is the exact QBO display name as of Sept 2026. Matching is
    # on the display name, so the real spelling has to be in this list.
    aliases: ["Kaaral USA LLC", "Kaaral USA", "Kaaral Inc"]
    billing_contact: null            # fill in before any reminder can send
    terms:
      - effective_from: 2026-01-01
        effective_to: 2026-07-31
        flat_fee_monthly: null       # historical structure; fill in if known
        commission_pct: null
        notes: "Pre-revision terms. Amounts unverified — do not validate against."
      - effective_from: 2026-08-01
        effective_to: null
        flat_fee_monthly: 0          # revised 8/1: no flat fee
        commission_pct: 50
        commission_basis: "net sales"
        notes: >-
          Revised 8/1/2026 to 50% commission, no flat fee. August and September
          invoices were reissued under these terms. Any invoice on or after
          8/1 carrying a flat fee is a billing error.
    status:
      reminders: suppressed
      reason: "Active rate renegotiation / dispute-sensitive. Aug + Sep invoices reissued."
      since: 2026-08-01
      review_on: 2026-10-01
    flags:
      - type: collections_followup
        note: "Carried forward — previously marked for collections follow-up."

  - name: Rust Check Corp
    # Confirm the exact QBO display name and add it here; the agent flags any
    # client it cannot match as having no contract terms on file.
    aliases: ["Rust Check", "RustCheck"]
    billing_contact: null
    terms:
      - effective_from: 2026-01-01
        effective_to: null
        flat_fee_monthly: null
        commission_pct: null
        notes: "Terms unverified pending reconciliation — do not validate amounts."
    credit_balance:
      amount: 6026.67
      as_of: 2026-09-01
      note: >-
        Credit carrying forward from Sept 2026. New invoices must net against
        this until it is exhausted. The agent verifies the credit is drawing
        down and flags it if an invoice is billed without applying it.
    status:
      reminders: suppressed
      reason: "Reconciliation in progress, and a credit balance is on file."
      since: 2026-09-01
      review_on: 2026-10-15

  - name: Zendex
    # "Zendex Tool Corp" is the exact QBO display name as of Sept 2026.
    aliases: ["Zendex Tool Corp", "Zendex Corp"]
    billing_contact: null
    terms:
      - effective_from: 2026-01-01
        effective_to: null
        flat_fee_monthly: null
        commission_pct: null
        notes: "Terms not yet captured."
    status:
      reminders: suppressed
      reason: "Carry-forward collections follow-up — human outreach, not automation."
      since: 2026-08-20
      review_on: 2026-10-01
    flags:
      - type: collections_followup
        note: "Carried forward — previously marked for collections follow-up."

  # --- Churn-risk pattern, kept for reference -------------------------------
  # Labeldaddy, Silko / CocoChoco and BeLAGU each went quiet while their AR
  # stacked across months. That pattern is detected automatically by the
  # stacked-AR rule in settings.yaml, so those clients need no entry here
  # unless their contract terms are being tracked. Add them when terms are known.

